services:
  # Backend Web Service
  - type: web
    name: local-skill-exchange-api
    env: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://local-skill-exchange.vercel.app
